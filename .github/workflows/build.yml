name: Build

on:
  push:
    branches:
      - develop
      - feat-sonarqube

jobs:
  sonarqube:
    name: SonarQube
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f599
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}